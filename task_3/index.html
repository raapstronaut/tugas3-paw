<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Anggota Perpustakaan</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Pendaftaran Anggota Perpustakaan</h1>

        <p>
            Silakan isi formulir berikut untuk mendaftar sebagai anggota perpustakaan.
        </p>

        <form action="detail.html" method="get">

            <label for="nama">Nama Lengkap</label>
            <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Masukkan nama lengkap"
                required
            >

            <label for="nim">NIM</label>
            <input
                type="text"
                id="nim"
                name="nim"
                placeholder="Masukkan NIM"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Masukkan email"
                required
            >

            <label for="prodi">Program Studi</label>
            <select id="prodi" name="prodi" required>
                <option value="">Pilih Program Studi</option>
                <option value="Informatika">Informatika</option>
                <option value="Teknik Elektro">Teknik Elektro</option>
                <option value="Teknik Sipil">Teknik Sipil</option>
            </select>

            <label for="keanggotaan">Jenis Keanggotaan</label>
            <select id="keanggotaan" name="keanggotaan" required>
                <option value="">Pilih Jenis Keanggotaan</option>
                <option value="Mahasiswa">Mahasiswa</option>
                <option value="Dosen">Dosen</option>
                <option value="Tenaga Kependidikan">Tenaga Kependidikan</option>
            </select>

            <button type="submit">Daftar</button>

        </form>
    </div>

</body>
</html>
